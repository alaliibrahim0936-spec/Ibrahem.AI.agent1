name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
      - run: |
          mv lib lib_backup
          flutter create . --platforms=android --project-name ibrahim_ai
          rm -rf lib
          mv lib_backup lib
      - run: flutter pub get
      - run: |
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=androiddebugkey" >> android/key.properties
          echo "storeFile=/home/runner/.android/debug.keystore" >> android/key.properties
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Ibrahim-APK-real
          path: build/app/outputs/flutter-apk/app-release.apk
