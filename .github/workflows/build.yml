name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Fix and Build
        run: |
          if [ -d "project" ]; then
            cd project
            echo "Found project folder"
          else
            echo "Building in root"
          fi
          ls -la
          flutter create. --platforms=android --project-name ibrahim_ai || true
          sed -i 's/gradle-.*-all.zip/gradle-8.5-all.zip/' android/gradle/wrapper/gradle-wrapper.properties || true
          flutter pub get
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Ibrahim-APK
          path: "**/app-debug.apk"
